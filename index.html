<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3979e8"><link rel="manifest" href="manifest.webmanifest"><title>나의 가계부</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#182b49;background:#f5f8fd}*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;padding:18px 16px 100px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.card{background:white;border:1px solid #e4ecf8;border-radius:20px;padding:19px;margin-bottom:14px;box-shadow:0 4px 15px #183f7e08}.hero{background:linear-gradient(130deg,#e3efff,#ecfff8)}.muted{color:#65768d;font-size:13px}.big{font-size:34px;font-weight:800;letter-spacing:-1px}.figure{font-size:22px;font-weight:750}.green{color:#168767}.red{color:#d74767}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.space{margin:12px 0}.tabbar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dfebfa;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.tabbar>div{display:flex;max-width:680px;width:100%}.tabbar button{flex:1;border:0;background:none;color:#73849b;padding:14px 2px;font-size:12px}.tabbar button.active{color:#266dea;font-weight:750}button{cursor:pointer}button.primary{background:#2e78ef;border:0;border-radius:13px;color:white;padding:13px 16px;font-size:14px;font-weight:700}button.outline{border:1px solid #bed2ed;background:white;border-radius:12px;padding:10px;color:#3569b5}button.danger{color:#be4561;border:0;background:#fff2f5;border-radius:9px;padding:8px}input,select{width:100%;background:white;border:1px solid #cbd8e9;padding:12px;border-radius:11px;font-size:16px;color:#182b49}label{font-size:13px;color:#566985;font-weight:650;display:block;margin-bottom:6px}.field{margin-bottom:12px}.item{padding:13px 0;border-bottom:1px solid #edf1f8}.item:last-child{border-bottom:0}.hidden{display:none!important}.pill{font-size:12px;padding:6px 10px;border-radius:20px;background:#eaf2ff;color:#376bb8}.bar{height:10px;background:#e7eff8;border-radius:10px;overflow:hidden;margin-top:8px}.bar>span{height:100%;background:#4789ea;display:block}.small{font-size:12px}.navmonth{display:flex;gap:5px;align-items:center}.navmonth button{border:0;background:#eaf1ff;border-radius:8px;padding:9px 12px}.navmonth span{font-size:13px;white-space:nowrap}.empty{padding:20px 5px;color:#8390a1;text-align:center}.hint{border-left:3px solid #6b9ced;padding-left:10px;font-size:12px;color:#667a98;line-height:1.6}textarea{width:100%;border:1px solid #cbd8e9;border-radius:12px;min-height:70px;padding:10px}.warning{background:#fff5e8;color:#8c5a1e;padding:10px;border-radius:10px;font-size:12px}
</style></head><body><main class="app"><header><h1>💙 나의 가계부</h1><div class="navmonth"><button onclick="moveMonth(-1)">‹</button><span id="month-label"></span><button onclick="moveMonth(1)">›</button></div></header>
<section id="home"></section><section id="budget" class="hidden"></section><section id="ledger" class="hidden"></section><section id="stats" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabbar"><div><button class="active" onclick="show('home',this)">🏠<br>홈</button><button onclick="show('budget',this)">💰<br>예산</button><button onclick="show('ledger',this)">🧾<br>내역</button><button onclick="show('stats',this)">📊<br>통계</button><button onclick="show('settings',this)">⚙️<br>설정</button></div></nav>
<script>
const DB='my-budget-v1';const now=new Date();let month=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;let view='home';const defaults={settings:{mode:'calendar',payday:25},months:{},transactions:[],fixedTemplates:[{id:'savings',name:'저축',amount:0},{id:'maintenance',name:'관리비',amount:0},{id:'interest',name:'이자비용',amount:0}]};let db;try{db={...defaults,...JSON.parse(localStorage.getItem(DB)||'{}')}}catch{db=structuredClone(defaults)};function save(){localStorage.setItem(DB,JSON.stringify(db));render()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function won(v){return Math.round(v||0).toLocaleString('ko-KR')+'원'}function n(v){return Number(v)||0}function monDate(s){return new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,1)}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function period(m){let d=monDate(m),y=d.getFullYear(),mo=d.getMonth();if(db.settings.mode==='calendar')return [new Date(y,mo,1),new Date(y,mo+1,0)];let p=Number(db.settings.payday)||25;return [new Date(y,mo,Math.min(p,new Date(y,mo+1,0).getDate())),new Date(y,mo+1,Math.min(p,new Date(y,mo+2,0).getDate())-1)]}function getM(m){return db.months[m]||{income:0,fixed:db.fixedTemplates.map(x=>({...x}))}}function initM(){if(!db.months[month]){db.months[month]={income:0,fixed:db.fixedTemplates.map(x=>({...x}))};save()}}function calc(){const [start,end]=period(month),m=getM(month),days=Math.round((end-start)/864e5)+1,fixed=m.fixed.reduce((s,x)=>s+n(x.amount),0),available=n(m.income)-fixed;let today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());let elapsed=Math.min(days,Math.max(0,Math.round((today-start)/864e5)+1));const tx=db.transactions.filter(t=>{let d=new Date(t.date+'T00:00:00');return d>=start&&d<=end});const spent=tx.filter(t=>t.type==='expense').reduce((s,x)=>s+n(x.amount),0),extra=tx.filter(t=>t.type==='income').reduce((s,x)=>s+n(x.amount),0);return{start,end,days,elapsed,fixed,available,daily:available/days,spent,extra,balance:available-spent,pace:available/days*elapsed-spent,tx}}function show(v,button){view=v;document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(v).classList.remove('hidden');document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));if(button)button.classList.add('active');else document.querySelectorAll('.tabbar button')[['home','budget','ledger','stats','settings'].indexOf(v)].classList.add('active');render();window.scrollTo(0,0)}function moveMonth(a){let d=monDate(month);d.setMonth(d.getMonth()+a);month=iso(d).slice(0,7);render()}function updateIncome(v){initM();db.months[month].income=n(v);save()}function setFixed(id,v){initM();const x=db.months[month].fixed.find(x=>x.id===id);if(x)x.amount=n(v);save()}function renameFixed(id,v){initM();const x=db.months[month].fixed.find(x=>x.id===id);if(x)x.name=v;save()}function addFixed(){let name=prompt('고정지출 이름 (예: 보험료)');if(!name?.trim())return;initM();db.months[month].fixed.push({id:crypto.randomUUID(),name:name.trim(),amount:0});save()}function deleteFixed(id){if(!confirm('이 항목을 이번 기간에서 삭제할까요?'))return;initM();db.months[month].fixed=db.months[month].fixed.filter(x=>x.id!==id);save()}function updateSettings(){db.settings.mode=document.getElementById('mode').value;db.settings.payday=n(document.getElementById('payday').value)||25;save()}function addTx(e){e.preventDefault();const f=new FormData(e.target);let amount=n(f.get('amount'));if(amount<=0)return alert('금액을 입력해주세요.');db.transactions.push({id:crypto.randomUUID(),date:f.get('date'),type:f.get('type'),amount,category:f.get('category'),memo:f.get('memo')||''});save();alert('거래를 저장했습니다.')}function delTx(id){if(confirm('이 거래를 삭제할까요?')){db.transactions=db.transactions.filter(x=>x.id!==id);save()}}function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='가계부-백업-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)}async function restoreData(el){let file=el.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d.months||!Array.isArray(d.transactions)||!d.settings)throw Error();if(confirm('현재 데이터를 백업 파일 내용으로 교체할까요?')){db=d;save()}}catch{alert('올바른 가계부 백업 파일이 아닙니다.')}}function csvDownload(){let rows=[['날짜','구분','금액','카테고리','내용'],...db.transactions.map(t=>[t.date,t.type==='income'?'수입':'지출',t.amount,t.category,t.memo])],str='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([str],{type:'text/csv;charset=utf-8'}));a.download='가계부-거래내역.csv';a.click();URL.revokeObjectURL(a.href)}async function importCsv(el){const file=el.files[0];if(!file)return;const str=await file.text();let lines=str.replace(/^\ufeff/,'').trim().split(/\r?\n/);if(lines.length<2)return alert('거래 내역이 없습니다.');function parse(line){let arr=[],cell='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){arr.push(cell);cell=''}else cell+=c}arr.push(cell);return arr}let headers=parse(lines.shift()).map(x=>x.trim());let find=(...names)=>headers.findIndex(x=>names.includes(x));let di=find('날짜','거래일자','거래일'),ai=find('금액','거래금액'),ti=find('구분','수입지출'),ci=find('카테고리','분류'),mi=find('내용','메모','거래내용','가맹점명');if(di<0||ai<0)return alert('날짜와 금액 열이 필요합니다. 샘플 CSV: 날짜,구분,금액,카테고리,내용');let records=[];for(let line of lines){if(!line.trim())continue;let r=parse(line);let date=(r[di]||'').trim().replaceAll('.','-').replaceAll('/','-');if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(date))continue;let [y,m,d]=date.split('-');date=`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;let amount=Number(String(r[ai]||'').replace(/[,₩원\s]/g,''));if(!Number.isFinite(amount)||amount===0)continue;let type=ti>=0&&['수입','income'].includes((r[ti]||'').toLowerCase())?'income':ti<0&&amount>0?'income':'expense';records.push({id:crypto.randomUUID(),date,type,amount:Math.abs(amount),category:ci>=0?r[ci]||'기타':'기타',memo:mi>=0?r[mi]||'':''})}if(!records.length)return alert('불러올 거래가 없습니다.');if(confirm(`${records.length}건을 추가할까요? 중복 여부를 확인해주세요.`)){db.transactions.push(...records);save();alert('가져오기 완료')}}function render(){document.getElementById('month-label').textContent=month.replace('-','년 ')+'월';const c=calc(),m=getM(month),f=esc,from=iso(c.start),to=iso(c.end),today=iso(now);document.getElementById('home').innerHTML=`<div class="card hero"><div class="muted">오늘 기준 예산 대비 여유금</div><div class="big ${c.pace<0?'red':'green'}">${c.pace>=0?'+':'−'}${won(Math.abs(c.pace))}</div><div class="muted">${from} ~ ${to} · ${c.elapsed}/${c.days}일 경과</div></div><div class="grid"><div class="card"><div class="muted">월수입</div><div class="figure">${won(m.income)}</div></div><div class="card"><div class="muted">고정지출</div><div class="figure">${won(c.fixed)}</div></div><div class="card"><div class="muted">하루 예산</div><div class="figure">${won(c.daily)}</div></div><div class="card"><div class="muted">이번 기간 남은 생활비</div><div class="figure ${c.balance<0?'red':''}">${won(c.balance)}</div></div></div><div class="card"><h2>생활비 사용 현황</h2><div class="row"><span class="muted">변동지출</span><strong>${won(c.spent)}</strong></div><div class="bar"><span style="width:${c.available>0?Math.min(100,Math.max(0,c.spent/c.available*100)):100}%"></span></div><div class="space muted">생활비 예산 ${won(c.available)} · 누적 기준 ${won(c.daily*c.elapsed)}</div><button class="primary" onclick="show('ledger')">+ 지출 입력하기</button></div><div class="card"><h2>최근 거래</h2>${transactionsHTML(c.tx.slice(-4).reverse())}</div>`;
document.getElementById('budget').innerHTML=`<h2>월수입 · 고정지출 관리</h2><div class="card"><div class="field"><label>이번 기간 월수입 (원)</label><input type="number" value="${n(m.income)}" onchange="updateIncome(this.value)"></div><div class="hint">고정지출은 기본적으로 예상 금액을 입력하세요. 관리비처럼 매월 달라지는 금액은 해당 기간에서 수정할 수 있습니다.</div></div><div class="card"><div class="row"><h2>고정지출</h2><button class="outline" onclick="addFixed()">+ 항목 추가</button></div>${m.fixed.map(x=>`<div class="item"><div class="row"><div style="flex:1"><input aria-label="항목명" value="${f(x.name)}" onchange="renameFixed('${x.id}',this.value)"></div><div style="flex:1"><input type="number" aria-label="금액" value="${n(x.amount)}" onchange="setFixed('${x.id}',this.value)"></div><button class="danger" onclick="deleteFixed('${x.id}')">삭제</button></div></div>`).join('')}<div class="row space"><strong>합계</strong><strong>${won(c.fixed)}</strong></div></div><div class="card hero"><div class="muted">고정지출 차감 후 생활비</div><div class="big">${won(c.available)}</div><div>일수 ${c.days}일 → 하루 ${won(c.daily)}</div></div><div class="warning">저축·관리비·대출이자처럼 예산에서 이미 차감한 항목은 일반 생활비 지출로 다시 입력하지 마세요. 이중 차감됩니다.</div>`;
document.getElementById('ledger').innerHTML=`<h2>거래내역</h2><div class="card"><h3>거래 추가</h3><form onsubmit="addTx(event)"><div class="grid"><div class="field"><label>날짜</label><input name="date" type="date" value="${today}" required></div><div class="field"><label>구분</label><select name="type"><option value="expense">생활비 지출</option><option value="income">추가 수입 (참고 기록)</option></select></div></div><div class="grid"><div class="field"><label>금액</label><input name="amount" type="number" min="1" required placeholder="금액"></div><div class="field"><label>카테고리</label><select name="category"><option>식비</option><option>카페</option><option>교통</option><option>쇼핑</option><option>생활</option><option>취미</option><option>기타</option></select></div></div><div class="field"><label>내용</label><input name="memo" placeholder="예: 점심 식사"></div><button class="primary" type="submit">거래 저장</button></form></div><div class="card"><h3>CSV 거래내역 가져오기</h3><div class="muted space">날짜,구분,금액,카테고리,내용 열을 사용하는 CSV 파일을 불러옵니다. 엑셀에서 CSV로 저장한 파일도 사용할 수 있어요.</div><input type="file" accept=".csv,text/csv" onchange="importCsv(this)"><div class="space"><button class="outline" onclick="csvDownload()">거래내역 CSV 내보내기</button></div></div><div class="card"><h3>해당 기간 거래</h3>${transactionsHTML([...c.tx].reverse())}</div>`;
let cats={};c.tx.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+n(x.amount));document.getElementById('stats').innerHTML=`<h2>지출 통계</h2><div class="card"><div class="muted">이번 기간 생활비 지출</div><div class="big">${won(c.spent)}</div><div class="space muted">일일 평균 ${won(c.elapsed?c.spent/c.elapsed:0)} · 하루 예산 ${won(c.daily)}</div></div><div class="card"><h3>카테고리별 지출</h3>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div class="row"><span>${f(k)}</span><b>${won(v)}</b></div><div class="bar"><span style="width:${c.spent?v/c.spent*100:0}%"></span></div></div>`).join('')||'<div class="empty">지출 내역이 없습니다.</div>'}</div>`;
document.getElementById('settings').innerHTML=`<h2>설정</h2><div class="card"><div class="field"><label>예산 계산 기간</label><select id="mode" onchange="updateSettings()"><option value="calendar" ${db.settings.mode==='calendar'?'selected':''}>매월 1일 ~ 말일</option><option value="payday" ${db.settings.mode==='payday'?'selected':''}>월급일 ~ 다음 월급일 전날</option></select></div><div class="field"><label>월급일 (월급일 기준일 때 사용)</label><select id="payday" onchange="updateSettings()">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${n(db.settings.payday)===i+1?'selected':''}>${i+1}일</option>`).join('')}</select></div><div class="hint">월급일 기준에서는 선택한 시작 월에 해당 기간을 생성합니다. 예: 11월 25일부터 12월 24일까지.</div></div><div class="card"><h3>백업 · 복원</h3><p class="muted">모든 데이터는 이 기기의 현재 브라우저에 저장됩니다. 브라우저 데이터를 지우거나 휴대폰을 바꾸기 전에 반드시 백업해주세요.</p><button class="primary" onclick="exportData()">전체 데이터 백업</button><div class="space"><label>백업 복원 (현재 데이터 교체)</label><input type="file" accept=".json,application/json" onchange="restoreData(this)"></div></div><div class="card"><h3>앱 정보</h3><p class="muted">간단한 무료 개인 가계부 · 첫 번째 시험 버전. 로그인 및 서버 동기화는 제공되지 않습니다.</p></div>`}
function transactionsHTML(arr){return arr.length?arr.map(t=>`<div class="item row"><div><b>${esc(t.memo||t.category)}</b><div class="muted">${esc(t.date)} · ${esc(t.category)}</div></div><div style="text-align:right"><b class="${t.type==='income'?'green':''}">${t.type==='income'?'+':'−'}${won(t.amount)}</b><div><button class="danger small" onclick="delTx('${t.id}')">삭제</button></div></div></div>`).join(''):'<div class="empty">아직 등록된 내역이 없습니다.</div>'}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
